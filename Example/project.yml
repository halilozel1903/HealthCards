name: HealthCardsDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  HealthCards:
    path: ..
targets:
  VitalsWatch:
    # A standalone (watch-only) app: one application target built with the watchOS SDK, no iOS companion.
    type: application
    platform: watchOS
    sources:
      - Shared
      - path: Watch
        excludes:
          - "*.entitlements"
    dependencies:
      - package: HealthCards
        product: HealthCards
      - package: HealthCards
        product: HealthCardsUI
      - sdk: HealthKit.framework
    info:
      path: VitalsWatch-Info.plist
      properties:
        CFBundleDisplayName: Vitals
        WKApplication: true
        WKWatchOnly: true
        NSHealthShareUsageDescription: Vitals reads your steps, activity, heart rate, sleep and workouts to show them as cards. Nothing is written or shared.
        NSHealthUpdateUsageDescription: Vitals never writes to Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.VitalsWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitals
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Vitals reads your steps, activity, heart rate, sleep and workouts to show them as cards. Nothing is written or shared.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        CODE_SIGN_ENTITLEMENTS: Watch/VitalsWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
  VitalsPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: Phone
        excludes:
          - "*.entitlements"
    dependencies:
      - package: HealthCards
        product: HealthCards
      - package: HealthCards
        product: HealthCardsUI
      - sdk: HealthKit.framework
    info:
      path: VitalsPhone-Info.plist
      properties:
        CFBundleDisplayName: Vitals
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Vitals reads your steps, activity, heart rate, sleep and workouts to show them as cards. Nothing is written or shared.
        NSHealthUpdateUsageDescription: Vitals never writes to Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.VitalsPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitals
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: Vitals reads your steps, activity, heart rate, sleep and workouts to show them as cards. Nothing is written or shared.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Vitals never writes to Health.
        CODE_SIGN_ENTITLEMENTS: Phone/VitalsPhone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  VitalsWatch:
    build:
      targets:
        VitalsWatch: all
    run:
      config: Debug
  VitalsPhone:
    build:
      targets:
        VitalsPhone: all
    run:
      config: Debug
