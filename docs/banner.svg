<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="HealthCards: HealthKit summary cards for iPhone and Apple Watch, with steps, heart rate, sleep and activity charts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140d2b"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b29" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6b29" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="196" font-size="66" font-weight="700" fill="#ffffff">HealthCards</text>
    <text x="82" y="244" font-size="22" fill="#b9b3d6">HealthKit summary cards for iPhone and Apple Watch</text>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="82" y="284" width="102" height="40" rx="20" fill="#ff6b29" fill-opacity="0.16"/>
    <text x="133" y="311" fill="#ff8a52">Steps</text>
    <rect x="196" y="284" width="140" height="40" rx="20" fill="#ff385e" fill-opacity="0.16"/>
    <text x="266" y="311" fill="#ff6680">Heart rate</text>
    <rect x="348" y="284" width="98" height="40" rx="20" fill="#5c6bfa" fill-opacity="0.18"/>
    <text x="397" y="311" fill="#8f99ff">Sleep</text>
    <rect x="458" y="284" width="114" height="40" rx="20" fill="#9ef500" fill-opacity="0.14"/>
    <text x="515" y="311" fill="#b8ff3d">Activity</text>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
    <text x="82" y="372" font-size="20" fill="#8e88ab">Swift Charts · HealthKit queries · sample data mode</text>
    <text x="82" y="406" font-size="17" fill="#6b6589">SwiftUI · Swift 6 · iOS 17+ · watchOS 10+</text>
  </g>

  <!-- Activity card -->
  <g filter="url(#shadow)">
    <rect x="690" y="48" width="290" height="190" rx="24" fill="#1c1a26"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="712" y="82" font-size="15" fill="#fa1250">Activity</text>
    <text x="958" y="82" font-size="13" fill="#8e8e93" text-anchor="end">Today</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <circle cx="772" cy="158" r="54" stroke="#fa1250" stroke-opacity="0.22" stroke-width="13"/>
    <circle cx="772" cy="158" r="54" stroke="#fa1250" stroke-width="13" stroke-dasharray="288 339" transform="rotate(-90 772 158)"/>
    <circle cx="772" cy="158" r="38" stroke="#9ef500" stroke-opacity="0.22" stroke-width="13"/>
    <circle cx="772" cy="158" r="38" stroke="#9ef500" stroke-width="13" stroke-dasharray="239 239" transform="rotate(-90 772 158)"/>
    <circle cx="772" cy="158" r="22" stroke="#00dbf0" stroke-opacity="0.22" stroke-width="13"/>
    <circle cx="772" cy="158" r="22" stroke="#00dbf0" stroke-width="13" stroke-dasharray="103 138" transform="rotate(-90 772 158)"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="846" y="118" font-size="12" fill="#8e8e93">Move</text>
    <text x="846" y="138" font-size="16" fill="#fa1250">426/500 kcal</text>
    <text x="846" y="162" font-size="12" fill="#8e8e93">Exercise</text>
    <text x="846" y="182" font-size="16" fill="#9ef500">34/30 min</text>
    <text x="846" y="206" font-size="12" fill="#8e8e93">Stand</text>
    <text x="846" y="226" font-size="16" fill="#00dbf0">9/12 hr</text>
  </g>

  <!-- Steps card -->
  <g filter="url(#shadow)">
    <rect x="1000" y="48" width="220" height="190" rx="24" fill="#1c1a26"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="1020" y="82" font-size="15" fill="#ff6b29">Steps</text>
    <text x="1020" y="122" font-size="30" fill="#ffffff">8,432</text>
  </g>
  <line x1="1020" y1="150" x2="1200" y2="150" stroke="#8e8e93" stroke-width="1" stroke-dasharray="4 3"/>
  <g fill="#ff6b29" fill-opacity="0.45">
    <rect x="1022" y="168" width="16" height="50" rx="3"/>
    <rect x="1048" y="150" width="16" height="68" rx="3"/>
    <rect x="1074" y="174" width="16" height="44" rx="3"/>
    <rect x="1100" y="140" width="16" height="78" rx="3"/>
    <rect x="1126" y="160" width="16" height="58" rx="3"/>
    <rect x="1152" y="132" width="16" height="86" rx="3"/>
  </g>
  <rect x="1178" y="164" width="16" height="54" rx="3" fill="#ff6b29"/>

  <!-- Sleep card -->
  <g filter="url(#shadow)">
    <rect x="690" y="258" width="530" height="130" rx="24" fill="#1c1a26"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="712" y="290" font-size="15" fill="#5c6bfa">Sleep</text>
    <text x="1198" y="290" font-size="13" fill="#8e8e93" text-anchor="end">11:12 PM – 6:51 AM</text>
    <text x="712" y="316" font-size="11" fill="#8e8e93">Awake</text>
    <text x="712" y="336" font-size="11" fill="#8e8e93">REM</text>
    <text x="712" y="356" font-size="11" fill="#8e8e93">Core</text>
    <text x="712" y="376" font-size="11" fill="#8e8e93">Deep</text>
  </g>
  <g>
    <rect x="760" y="307" width="10" height="12" rx="2" fill="#ff7859"/>
    <rect x="960" y="307" width="6" height="12" rx="2" fill="#ff7859"/>
    <rect x="1150" y="307" width="8" height="12" rx="2" fill="#ff7859"/>
    <rect x="770" y="347" width="44" height="12" rx="2" fill="#3380ff"/>
    <rect x="862" y="347" width="40" height="12" rx="2" fill="#3380ff"/>
    <rect x="966" y="347" width="50" height="12" rx="2" fill="#3380ff"/>
    <rect x="1044" y="347" width="58" height="12" rx="2" fill="#3380ff"/>
    <rect x="1128" y="347" width="22" height="12" rx="2" fill="#3380ff"/>
    <rect x="1158" y="347" width="40" height="12" rx="2" fill="#3380ff"/>
    <rect x="814" y="367" width="48" height="12" rx="2" fill="#5c40db"/>
    <rect x="1016" y="367" width="28" height="12" rx="2" fill="#5c40db"/>
    <rect x="902" y="327" width="58" height="12" rx="2" fill="#5ccbff"/>
    <rect x="1102" y="327" width="26" height="12" rx="2" fill="#5ccbff"/>
  </g>

  <!-- Heart rate card -->
  <g filter="url(#shadow)">
    <rect x="690" y="408" width="300" height="122" rx="24" fill="#1c1a26"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="712" y="440" font-size="15" fill="#ff385e">Heart Rate</text>
    <text x="712" y="480" font-size="28" fill="#ffffff">72 <tspan font-size="15" fill="#8e8e93">bpm</tspan></text>
    <text x="968" y="440" font-size="12" fill="#8e8e93" text-anchor="end">Resting 57</text>
  </g>
  <g fill="#ff385e">
    <rect x="810" y="470" width="8" height="26" rx="4"/>
    <rect x="826" y="474" width="8" height="20" rx="4"/>
    <rect x="842" y="462" width="8" height="40" rx="4"/>
    <rect x="858" y="452" width="8" height="52" rx="4"/>
    <rect x="874" y="466" width="8" height="34" rx="4"/>
    <rect x="890" y="446" width="8" height="66" rx="4"/>
    <rect x="906" y="458" width="8" height="42" rx="4"/>
    <rect x="922" y="468" width="8" height="30" rx="4"/>
    <rect x="938" y="472" width="8" height="24" rx="4"/>
    <rect x="954" y="476" width="8" height="18" rx="4"/>
  </g>

  <!-- Weekly trend card -->
  <g filter="url(#shadow)">
    <rect x="1010" y="408" width="210" height="122" rx="24" fill="#1c1a26"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="1030" y="440" font-size="15" fill="#ff6b29">This week</text>
    <text x="1198" y="440" font-size="13" fill="#9ef500" text-anchor="end">+12%</text>
  </g>
  <path d="M1030 500 C1050 486 1060 492 1080 480 S1110 470 1130 476 S1160 458 1200 452 L1200 514 L1030 514 Z" fill="url(#area)"/>
  <path d="M1030 500 C1050 486 1060 492 1080 480 S1110 470 1130 476 S1160 458 1200 452" fill="none" stroke="#ff6b29" stroke-width="3" stroke-linecap="round"/>

  <!-- Sample data label -->
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="82" y="440" width="142" height="30" rx="15" fill="#ffd60a" fill-opacity="0.16"/>
    <text x="153" y="460" text-anchor="middle" fill="#ffd60a">Sample data</text>
    <text x="238" y="460" fill="#6b6589" font-weight="400">mode for previews, demos and the simulator</text>
  </g>
</svg>
