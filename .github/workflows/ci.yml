name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test:
    name: Tests (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, watchOS]
    steps:
      - uses: actions/checkout@v5
      - name: Build & test on ${{ matrix.platform }} Simulator
        run: bash scripts/test.sh ${{ matrix.platform }}

  example:
    name: Example apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install watchOS platform if missing
        run: |
          if ! xcrun simctl list runtimes available | grep -q watchOS; then
            xcodebuild -downloadPlatform watchOS
          fi
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Build for watchOS Simulator
        run: |
          xcodebuild build \
            -project Example/HealthCardsDemo.xcodeproj \
            -scheme VitalsWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Example/HealthCardsDemo.xcodeproj \
            -scheme VitalsPhone \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: [swift, test, example]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Capture screenshots (Apple Watch and iPhone)
        run: >-
          bash scripts/screenshots.sh HealthCardsDemo
          --watch VitalsWatch io.github.halilozel1903.VitalsWatch summary heart
          --iphone VitalsPhone io.github.halilozel1903.VitalsPhone today week sleep
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
